name: Deterministic KAT

on:
  workflow_dispatch:
  push:
    branches:
      - dfvrf-macos-detkat

jobs:
  macos-detkat:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-intel
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Show environment
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          go version
          go env GOOS GOARCH

      - name: Run deterministic tests
        run: |
          go test ./crypto -run 'TestFalconVRFDeterministic|TestFalconVRFKeccakMode|TestVRFUniqueness_Determinism|TestVRFUniqueness_Determinism_Keccak' -v

      - name: Generate deterministic known-answer vectors
        run: |
          go run ./cmd/detkat > "detkat_${{ matrix.name }}.json"
          shasum -a 256 "detkat_${{ matrix.name }}.json"
          grep '"vector_digest_hex"' "detkat_${{ matrix.name }}.json"

      - name: Compare with Windows/Linux reference digest
        run: |
          expected="359b9122b880be88c0a451f7c63a76fb6c225cb96fb02af9dc1ae6e19623e7f2"
          actual="$(shasum -a 256 "detkat_${{ matrix.name }}.json" | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Upload KAT artifact
        uses: actions/upload-artifact@v5
        with:
          name: detkat-${{ matrix.name }}
          path: detkat_${{ matrix.name }}.json

  compare-artifacts:
    name: compare macOS KAT artifacts
    runs-on: ubuntu-latest
    needs: macos-detkat

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Compare artifacts byte-for-byte
        run: |
          find artifacts -type f -print -exec sha256sum {} \;
          cmp artifacts/detkat-macos-intel/detkat_macos-intel.json artifacts/detkat-macos-arm64/detkat_macos-arm64.json
